[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ncte"
version = "0.6.0"
description = "Novel Context Translation Engine — context-aware Japanese EPUB → Traditional Chinese (Taiwan) translator (OpenRouter, local CLI)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "lxml>=5.2",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
agent = ["mcp>=2.3"]  # `ncte mcp`: the agent commands as MCP tools
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "lxml-stubs",
]

[project.scripts]
ncte = "ncte.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ncte"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "ncte/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
